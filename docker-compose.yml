services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm_eval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm_eval}
      POSTGRES_DB: ${POSTGRES_DB:-llm_eval}
    ports:
      - "5432:5432"
    volumes:
      - llm_eval_postgres_data:/var/lib/postgresql/data

volumes:
  llm_eval_postgres_data:
